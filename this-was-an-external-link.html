<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Second Click — External Link Target</title>
    <style>
      body {
        background: #f0f9ff;
        color: #0369a1;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .card {
        background: #ffffff;
        border: 2px solid #bae6fd;
        border-radius: 16px;
        padding: 40px;
        max-width: 520px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(2, 132, 199, 0.15);
      }
      .icon {
        font-size: 56px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 12px;
        color: #0369a1;
      }
      p {
        font-size: 15px;
        color: #0c4a6e;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-block;
        background: #0284c7;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #0369a1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🌐</div>
      <h1>THIS WAS AN EXTERNAL LINK</h1>
      <p>this was an external link. You clicked a header navigation item or search query. On dirty download mirrors, category links and search bars frequently redirect to external ad partners.</p>
      <a href="./" class="btn">← Back to Second Click</a>
    </div>
  </body>
</html>
